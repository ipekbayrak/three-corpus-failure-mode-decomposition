[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-ids-transfer"
version = "0.1.0"
description = "Lean, reproducible IDS transfer pipeline for novelty-structured failure analysis."
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
]
ft = [
  "torch>=2.2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
